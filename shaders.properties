# VanillaDeluxe 1.11.0 (Performance & Polish Update) - Iris directives, menus and profiles.

# ---- Iris behaviour ---------------------------------------------------------
# The pack draws its own sun, sky and vignette, and lights blocks itself.
oldLighting=false
oldHandLight=false
separateAo=true
sun=false
moon=true
vignette=false
underwaterOverlay=false
particles.ordering=after
rain.depth=false
beacon.beam.depth=false

# ---- Weather and images -------------------------------------------------------
# Rain is the vanilla rain, shaded by the pack. Its splash particles are filtered out in the
# particle pass, since Iris can only switch them off together with the rain. The weather map holds the highest block of each column near the
# player, so that no rain or snow falls under a roof. The crystal image holds where the End
# crystals are.
iris.features.required=CUSTOM_IMAGES
image.rtHeightImg=rtHeightSampler red_integer r32ui unsigned_int true false 128 128
image.rtCrystalImg=rtCrystalSampler red_integer r32ui unsigned_int true false 32 4

# ---- Ray tracing ------------------------------------------------------------------
# The blocks around the player and the lights near each cell of them, rebuilt in every shadow
# pass. Blocks behind the camera must be in there too, because they shadow what is in front of
# it, so culling stops within voxelDistance. The shadow pass of the Nether only runs for this.
# Advanced Color Tracing stores the colour of light sources and stained glass in the voxels.
# Volumetric smoke rises from the listed fires, torches and lava, so it needs the same images.
#ifdef VOLUMETRIC_SMOKE
image.rtVoxelImg=rtVoxelSampler red_integer r32ui unsigned_int true false 128 64 128
image.rtLightImg=rtLightSampler red_integer r32ui unsigned_int true false 256 8 16
shadow.culling=reversed
program.world-1/shadow.enabled=VOLUMETRIC_SMOKE
#else
#ifdef RAY_TRACING
#ifdef RT_BLOCK_LIGHT
image.rtVoxelImg=rtVoxelSampler red_integer r32ui unsigned_int true false 128 64 128
image.rtLightImg=rtLightSampler red_integer r32ui unsigned_int true false 256 8 16
shadow.culling=reversed
program.world-1/shadow.enabled=RT_BLOCK_LIGHT
#else
shadow.culling=true
program.world-1/shadow.enabled=RT_BLOCK_LIGHT
#endif
#else
# The shadow pass is usually the largest single cost of a frame.
shadow.culling=true
program.world-1/shadow.enabled=RAY_TRACING
#endif
#endif

# The two spatial denoiser passes only run with ray tracing.
program.world0/deferred2.enabled=RAY_TRACING
program.world0/deferred3.enabled=RAY_TRACING
program.world-1/deferred2.enabled=RAY_TRACING
program.world-1/deferred3.enabled=RAY_TRACING
program.world1/deferred2.enabled=RAY_TRACING
program.world1/deferred3.enabled=RAY_TRACING

shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowPlayer=true
shadowBlockEntities=true

# Vanilla clouds are replaced by the volumetric layer when that option is on.
#ifdef VOLUMETRIC_CLOUDS
clouds=off
#else
clouds=fancy
#endif

# ---- Buffer sizes -----------------------------------------------------------
size.buffer.colortex6=0.5 0.5
size.buffer.colortex8=0.5 0.5
size.buffer.colortex9=0.5 0.5
size.buffer.colortex10=0.5 0.5
size.buffer.colortex11=256 128
size.buffer.colortex12=0.5 0.5
size.buffer.colortex13=1 1
size.buffer.colortex14=0.5 0.5
size.buffer.colortex19=0.5 0.5

# ---- Blending ---------------------------------------------------------------
# G-buffer data must never blend. Only albedo may, for name tags and similar.
blend.gbuffers_terrain=off
blend.gbuffers_basic=off
blend.gbuffers_clouds=off
blend.gbuffers_spidereyes=off
blend.gbuffers_hand=off
blend.gbuffers_item=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex3=off

# The sky objects add light on top of each other.
blend.gbuffers_skybasic=ONE ONE ONE ONE
blend.gbuffers_skytextured=ONE ONE ONE ONE

# Forward passes write premultiplied colour, which allows additive highlights.
blend.gbuffers_water=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex5=off
# Tinted glass filters what is behind it, so its colour multiplies instead of covering.
blend.gbuffers_water.colortex15=DST_COLOR ZERO ZERO SRC_ALPHA
blend.gbuffers_hand_water=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# The offsets of overlapping raindrops add up.
blend.gbuffers_weather.colortex16=ONE ONE ONE ONE
blend.gbuffers_lightning=ONE ONE ONE ONE
blend.gbuffers_beaconbeam=ONE ONE ONE ONE

# Passes that always replace their whole target.
blend.deferred=off
blend.deferred1=off
blend.deferred2=off
blend.deferred3=off
blend.deferred4=off
blend.composite=off
blend.composite1=off
blend.composite2=off
blend.composite3=off
blend.composite4=off
blend.composite5=off

# ---- Profiles ---------------------------------------------------------------
# Ray tracing levels, from vanilla lighting to the most bounces and the longest rays. Off and Low
# also use lighter shadows, reflections and volumetrics, for older graphics cards.
# Iris cycles through them in this order. Medium is the standard (see settings.glsl).
profile.RT_OFF=!RAY_TRACING !RT_BLOCK_LIGHT !SCREEN_SPACE_GI !RT_COLOR_TRACING SHADOW_FILTER_SAMPLES=6 SHADOW_BLOCKER_SAMPLES=4 VL_STEPS=6 CLOUD_STEPS=8 CLOUD_SUN_STEPS=2 SSR_STEPS=12 SSR_REFINE=2 !SSR_ON_SURFACES !ROUGH_REFLECTIONS AO_STEPS=3 POM_SAMPLES=16 WATER_WAVE_OCTAVES=6
profile.RT_LOW=RAY_TRACING RT_BLOCK_LIGHT !SCREEN_SPACE_GI !RT_COLOR_TRACING DENOISER_RADIUS=2 SHADOW_FILTER_SAMPLES=6 SHADOW_BLOCKER_SAMPLES=4 VL_STEPS=6 CLOUD_STEPS=8 CLOUD_SUN_STEPS=2 SSR_STEPS=12 SSR_REFINE=2 !SSR_ON_SURFACES !ROUGH_REFLECTIONS AO_STEPS=3 POM_SAMPLES=16 WATER_WAVE_OCTAVES=6
profile.RT_MEDIUM=RAY_TRACING RT_BLOCK_LIGHT SCREEN_SPACE_GI !RT_COLOR_TRACING RT_BOUNCES=1 RT_DISTANCE=32 RT_STEPS=12 DENOISER_RADIUS=2 SHADOW_FILTER_SAMPLES=8 SHADOW_BLOCKER_SAMPLES=6 VL_STEPS=8 CLOUD_STEPS=10 CLOUD_SUN_STEPS=3 SSR_STEPS=16 SSR_REFINE=3 SSR_ON_SURFACES ROUGH_REFLECTIONS AO_STEPS=4 POM_SAMPLES=24 WATER_WAVE_OCTAVES=8
profile.RT_HIGH=RAY_TRACING RT_BLOCK_LIGHT SCREEN_SPACE_GI RT_COLOR_TRACING RT_BOUNCES=3 RT_DISTANCE=64 RT_STEPS=16 DENOISER_RADIUS=2 SHADOW_FILTER_SAMPLES=8 SHADOW_BLOCKER_SAMPLES=6 VL_STEPS=8 CLOUD_STEPS=10 CLOUD_SUN_STEPS=3 SSR_STEPS=16 SSR_REFINE=3 SSR_ON_SURFACES ROUGH_REFLECTIONS AO_STEPS=4 POM_SAMPLES=24 WATER_WAVE_OCTAVES=8
profile.RT_ULTRA=RAY_TRACING RT_BLOCK_LIGHT SCREEN_SPACE_GI RT_COLOR_TRACING RT_BOUNCES=24 RT_DISTANCE=256 RT_STEPS=32 DENOISER_RADIUS=3 SHADOW_FILTER_SAMPLES=8 SHADOW_BLOCKER_SAMPLES=6 VL_STEPS=8 CLOUD_STEPS=10 CLOUD_SUN_STEPS=3 SSR_STEPS=16 SSR_REFINE=3 SSR_ON_SURFACES ROUGH_REFLECTIONS AO_STEPS=4 POM_SAMPLES=24 WATER_WAVE_OCTAVES=8

